server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite output has content hashes in the file names: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Must always be re-checked so a new deploy (and the SW cleanup) reaches users.
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /manifest.json         { add_header Cache-Control "no-cache"; }
    location = /js/service_worker.js  { add_header Cache-Control "no-cache"; }

    location ~* \.(png|svg|ico)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA fallback: /transactions, /accounts, ... are served by index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
